<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>点つなぎ作成</title>
  <link rel="stylesheet" href="styles.css?v=20261015-3">
</head>
<body>
  <div class="app-shell">
    <aside class="controls" aria-label="プリント設定">
      <div class="brand"><h1>点つなぎ作成</h1><div class="brand-actions"><a class="home-link" href="../../index.html">入口に戻る</a><span id="pageCount">0枚</span></div></div>
      <p class="intro">左のお手本を見て、右に同じ線を写すプリントです。</p>
      <label class="field"><span>プリント名</span><input id="worksheetTitle" type="text" maxlength="32" value="点つなぎ" autocomplete="off"></label>
      <label class="field"><span>名前</span><input id="studentName" type="text" maxlength="24" autocomplete="off"></label>
      <fieldset id="generationFields">
        <legend>問題の条件</legend>
        <p class="help">条件を変えると、自動で問題を作り直します。</p>
        <div class="settings-grid">
          <label class="field"><span>縦の点の数</span><input id="rows" type="number" step="1" inputmode="numeric"></label>
          <label class="field"><span>横の点の数</span><input id="columns" type="number" step="1" inputmode="numeric"></label>
          <label class="field"><span>線の本数（区間数）</span><input id="lineCount" type="number" step="1" inputmode="numeric"></label>
          <label class="field"><span>線のレベル</span><select id="level"><option value="1">1：たて・よこ</option><option value="2">2：45度のななめも</option><option value="3">3：1点×2点のななめも</option></select></label>
        </div>
        <p id="levelDescription" class="help"></p>
        <div class="check-row"><label><input id="oneStroke" type="checkbox"> 一筆書き</label></div>
        <p class="help">ON：同じ点を通らない一本道。OFF：分岐・閉じた形・離れた線も作れます。</p>
        <label class="field"><span>作成する問題数</span><input id="problemCount" type="number" step="1" inputmode="numeric"></label>
      </fieldset>
      <fieldset>
        <legend>ヒント（組み合わせ可能）</legend>
        <div class="check-row">
          <label><input id="hintUsed" type="checkbox"> 使う点を大きくする</label>
          <label><input id="hintTrace" type="checkbox"> 点線でなぞる</label>
          <label><input id="hintStart" type="checkbox"> スタートを大きくする</label>
        </div>
        <p class="help">ヒントを変えても問題の形は変わりません。スタートの輪は描き始める場所の一例です。筆順は自由です。</p>
      </fieldset>
      <label class="field"><span>1ページの問題数</span><select id="perPage"></select></label>
      <label class="field"><span>穴あけガイド</span><select id="printPunchGuide"><option value="none">なし</option><option value="left">左の真ん中 ◀</option><option value="top">上の真ん中 ▲</option></select></label>
      <p id="sizeWarning" class="notice" role="status" hidden></p>
      <p id="pendingNotice" class="notice" role="status" hidden>条件に合わせて自動で作り直します。作成できるまで、プレビューは変更前の問題を表示します。</p>
      <div class="actions">
        <button id="printBtn" type="button" disabled>印刷 / PDF保存</button>
        <button id="regenerateBtn" type="button">全問を作り直す</button>
      </div>
      <p class="help">A4たて用です。印刷設定は倍率100％・余白なしがおすすめです。</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </aside>
    <main class="preview-wrap" aria-label="印刷プレビュー"><div id="pages" class="pages"></div></main>
  </div>
  <script src="generator.js?v=20261015-2"></script>
  <script src="app.js?v=20261015-3"></script>
</body>
</html>
